<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070403">
<title>Sadie Sink</title>
<style>
:root{--c:#F08A3C;--a:#FFA05C;--l:#FFC08F;--bg:#070403;--tx:#f8f0e8;--mut:#b09a88;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:radial-gradient(900px 500px at 50% -10%,rgba(240,138,60,.16),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(255,90,40,.08),transparent 60%),#070403}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);position:relative}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);z-index:0}
button{font:inherit;color:inherit;cursor:pointer}
.hd{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(240,138,60,.25);background:rgba(10,5,3,.85)}
.logo{display:flex;align-items:center;gap:10px}
.logo b{display:block;font-size:17px;letter-spacing:5px;font-weight:600}
.logo small{white-space:nowrap;display:block;font-size:8px;letter-spacing:2.2px;color:var(--a);margin-top:2px}
.sp{flex:1}
.pill{white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid rgba(240,138,60,.4);border-radius:14px;padding:6px 10px;font-size:9.5px;letter-spacing:1.5px;background:rgba(240,138,60,.08)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pu 2s infinite}
.dot.off{background:var(--warn);box-shadow:0 0 8px var(--warn)}
@keyframes pu{50%{opacity:.4}}
.gear{width:36px;height:36px;border-radius:10px;border:1px solid rgba(240,138,60,.4);background:rgba(240,138,60,.08);font-size:17px;display:grid;place-items:center;padding:0}
#view{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:12px 12px 44px}
.pn{position:relative;border:1px solid rgba(240,138,60,.28);border-radius:14px;background:linear-gradient(160deg,rgba(255,140,60,.08),rgba(18,9,5,.78));padding:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 0 18px rgba(240,138,60,.06) inset}
.pn::before,.pn::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--c);pointer-events:none}
.pn::before{top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.pn::after{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:10.5px;letter-spacing:2.5px;color:var(--a);font-weight:600}
.ph em{font-style:normal;font-size:9.5px;letter-spacing:1px;color:var(--mut);font-weight:400}
.hero{text-align:center;padding:4px 0 2px}
.orb{display:block;margin:0 auto;width:min(78vw,300px);height:auto;filter:drop-shadow(0 0 24px rgba(240,138,60,.45))}
.hero h1{margin:-6px 0 2px;font-size:30px;letter-spacing:12px;font-weight:300;color:#ffe3cf;text-shadow:0 0 18px rgba(240,138,60,.8)}
.hero .v{font-size:10px;letter-spacing:5px;color:var(--a)}
.clk{margin-top:10px;font-size:26px;letter-spacing:3px;font-weight:600;color:#ffd9bd;text-shadow:0 0 14px rgba(240,138,60,.6)}
.dt{font-size:11px;letter-spacing:2px;color:var(--mut);margin-top:2px}
.hi{margin-top:8px;font-size:15px;color:var(--tx)}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ovi{display:flex;align-items:center;gap:10px;border:1px solid rgba(240,138,60,.2);border-radius:10px;padding:9px 10px;background:rgba(0,0,0,.25)}
.ovi i{font-style:normal;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(240,138,60,.14);font-size:15px;flex:none}
.ovi b{display:block;font-size:12.5px;font-weight:600}
.ovi small{display:block;font-size:10.5px;margin-top:1px}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}.s-mut{color:var(--mut)}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.agc{text-align:left;border:1px solid rgba(240,138,60,.22);border-radius:10px;padding:10px;background:rgba(0,0,0,.28);position:relative}
.agc.on{border-color:var(--c);box-shadow:0 0 14px rgba(240,138,60,.3)}
.agc .t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.agc .t i{font-style:normal;font-size:17px}
.agc small{display:flex;align-items:center;gap:5px;font-size:10px;margin:5px 0 7px;color:var(--mut)}
.agc small u{width:6px;height:6px;border-radius:50%;background:var(--mut);text-decoration:none}
.agc.on small u{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.agc.on small{color:var(--ok)}
.wv{display:flex;align-items:center;gap:2px;height:20px}
.wv i{display:block;width:3px;height:100%;border-radius:2px;background:var(--c);transform-origin:center;animation:wv 1.1s ease-in-out infinite}
.wv.still i{animation-play-state:paused;opacity:.35;transform:scaleY(.3)}
@keyframes wv{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.fd{display:flex;align-items:center;gap:10px;border:1px solid rgba(240,138,60,.18);border-radius:10px;padding:8px 10px;margin-bottom:7px;background:rgba(0,0,0,.25)}
.fd>i{font-style:normal;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(240,138,60,.12);flex:none;font-size:15px}
.fd .tx{flex:1;min-width:0}
.fd b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{flex:none;font-size:8.5px;letter-spacing:1px;font-weight:700;border-radius:6px;padding:3px 6px;border:1px solid}
.tg.INFO{color:#7dd3fc;border-color:#7dd3fc55}.tg.WARN{color:var(--warn);border-color:#fbbf2466}.tg.TIP{color:var(--ok);border-color:#34d39966}.tg.LIVE{color:var(--a);border-color:#ffa05c66}
.tl{position:relative;padding-left:16px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:rgba(240,138,60,.35)}
.tli{position:relative;display:flex;justify-content:space-between;gap:8px;padding:7px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-15px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tli.done::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tli small{display:block;color:var(--mut);font-size:10.5px}
.tli em{font-style:normal;font-size:11px;color:var(--a);white-space:nowrap}
.qc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid rgba(240,138,60,.22);border-radius:10px;padding:11px 12px;margin-bottom:7px;background:rgba(0,0,0,.28);font-size:13px}
.qc i{font-style:normal;font-size:15px}
.qc:active,.agc:active,.pill2:active,.cc button:active{transform:scale(.97);border-color:var(--c)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.rings svg{width:78px;height:78px}
.rings small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mut);margin-top:3px}
.mm{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;align-items:center}
.mm .st div{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(240,138,60,.14)}
.mm .st b{color:var(--a)}
.lm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:9px 12px;border-bottom:1px solid rgba(240,138,60,.2);flex:none;background:rgba(10,5,3,.6)}
.pill2{flex:none;background:rgba(0,0,0,.3);border:1px solid rgba(240,138,60,.22);border-radius:18px;padding:6px 12px;font-size:12.5px;color:var(--mut)}
.pill2.on{border-color:var(--c);color:var(--tx);background:rgba(240,138,60,.16);box-shadow:0 0 10px rgba(240,138,60,.3)}
.vb{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid rgba(240,138,60,.14);font-size:11px;letter-spacing:2px;color:var(--mut)}
.vb .wv{flex:1;max-width:160px}
.vb.live{color:var(--a)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:13px}
.row{display:flex;gap:9px;align-items:flex-end}
.row.u{flex-direction:row-reverse}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px}
.av.k{background:var(--c);box-shadow:0 0 14px rgba(240,138,60,.5)}
.av.me{background:#2c2724;font-size:11px}
.bub{max-width:82%;padding:11px 13px;border-radius:16px;font-size:15px;line-height:1.5;word-wrap:break-word}
.row.k .bub{background:rgba(24,13,8,.9);border:1px solid rgba(240,138,60,.28);border-bottom-left-radius:5px}
.row.u .bub{background:rgba(240,138,60,.14);border:1px solid var(--c);border-bottom-right-radius:5px}
.bub.err{border-color:#7f2a2a!important;color:#ffb3b3}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:8px;font-size:12px;color:var(--mut)}
.meta button{background:none;border:0;color:var(--a);font-size:12px;padding:2px 0}
.web{color:#7dd3a0}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--a);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
.chero{text-align:center;padding:10px 0 4px}
.chero h2{margin:4px 0 2px;font-size:20px;letter-spacing:6px;font-weight:400}
.chero p{margin:0 0 12px;font-size:10px;letter-spacing:3px;color:var(--a)}
.chips{display:flex;flex-direction:column;gap:9px}
.chip{background:rgba(0,0,0,.3);border:1px solid rgba(240,138,60,.22);border-radius:12px;padding:12px 13px;text-align:left;font-size:14px}
.cc{display:flex;gap:8px;overflow-x:auto;padding:7px 12px 2px;flex:none}
.cc button{flex:none;background:rgba(0,0,0,.3);border:1px solid rgba(240,138,60,.22);border-radius:15px;padding:6px 12px;font-size:12.5px;color:var(--l)}
.inbar{display:flex;gap:8px;padding:9px 12px;border-top:1px solid rgba(240,138,60,.2);background:rgba(10,5,3,.85);flex:none;align-items:center}
.inbar textarea{flex:1;resize:none;height:44px;background:rgba(0,0,0,.35);border:1px solid rgba(240,138,60,.25);border-radius:22px;color:var(--tx);padding:11px 15px;font:inherit;font-size:15px;outline:none}
.inbar textarea:focus{border-color:var(--c)}
.rb{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--c);background:rgba(240,138,60,.1);font-size:18px;padding:0}
.rb.go{background:var(--c);border:0;box-shadow:0 0 16px rgba(240,138,60,.45)}
.rb.go svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.live{animation:pu 1s infinite;background:rgba(240,138,60,.35)}
.gr{margin:4px 0 2px;font-size:26px;font-weight:600}
.gr span{color:var(--a)}
.sub{margin:0 0 14px;color:var(--mut);font-size:14px}
.prompt{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid rgba(240,138,60,.22);border-radius:16px;padding:8px 8px 8px 14px;margin-bottom:12px}
.prompt input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:15px;padding:7px 0}
.ch{margin:0 0 4px;font-size:16px;line-height:1.45}
.trait{margin:7px 0;font-size:14.5px}.trait span{color:var(--mut)}
.line{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid rgba(240,138,60,.14);font-size:15px}
.line em{font-style:normal;color:var(--mut)}.line em.ok{color:var(--ok)}.line em.no{color:var(--warn)}
label{display:block;font-size:10.5px;letter-spacing:2px;color:var(--mut);margin:14px 0 6px}
input.k,select.k,textarea.k{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(240,138,60,.25);border-radius:11px;color:var(--tx);padding:12px;font:inherit;font-size:15px;outline:none}
textarea.k{min-height:84px;resize:vertical}
input.k:focus,select.k:focus,textarea.k:focus{border-color:var(--c)}
select.k option{background:#17100b}
.btn{background:none;border:1px solid var(--c);color:var(--l);border-radius:9px;padding:9px 13px;font-size:12.5px;letter-spacing:1px;margin:9px 8px 0 0}
.btn.on{background:var(--c);color:#fff}
.btn.red{border-color:#7f2a2a;color:#ffb3b3}
.hint{font-size:12.5px;line-height:1.5;color:var(--mut);margin:7px 0 0}
.empty{text-align:center;color:var(--mut);padding:20px 8px;font-size:14px;line-height:1.5}
.idea{border:1px solid rgba(240,138,60,.2);border-left:3px solid var(--c);border-radius:10px;padding:11px 12px;margin-bottom:9px;font-size:14.5px;line-height:1.5;background:rgba(0,0,0,.25)}
.goal{border:1px solid rgba(240,138,60,.2);border-left:3px solid var(--c);border-radius:10px;padding:12px;margin-bottom:10px;background:rgba(0,0,0,.25)}
.goal b{font-size:15px}.goal small{display:block;color:var(--mut);margin:3px 0 9px;font-size:12px}
.bar2{height:6px;border-radius:3px;background:#2e1d10;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--l));border-radius:3px}
input[type=range]{width:100%;accent-color:var(--c);margin:8px 0 0}
.qg{display:flex;flex-wrap:wrap;gap:7px}
.qg button{background:rgba(0,0,0,.3);border:1px solid rgba(240,138,60,.22);border-radius:14px;padding:7px 11px;font-size:12.5px;color:var(--l)}
nav{position:relative;z-index:2;display:flex;align-items:flex-end;border-top:1px solid rgba(240,138,60,.25);background:rgba(10,5,3,.92);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--a)}
nav button.talk{flex:none;width:66px;height:66px;margin:-22px 6px 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb27a,#F08A3C 55%,#b9531a);border:2px solid rgba(255,224,200,.6);box-shadow:0 0 26px rgba(240,138,60,.65);justify-content:center;color:#fff;padding:0}
nav button.talk svg{width:28px;height:28px}
nav button.talk.live{animation:pu 1s infinite}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#2b1809;border:1px solid var(--c);color:var(--tx);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
 <div class="hd" id="hd"></div>
 <div id="view"></div>
 <nav id="nav"></nav>
</div>
<div id="toast"></div>
<script>
var DEFMODEL="gemini-3.8-flash",VERSION="3.0.0";
var MODELS=[
 ["gemini-3.8-flash","Gemini 3.8 Flash · el más nuevo (recomendado)"],
 ["gemini-3.5-flash-lite","Gemini 3.5 Flash-Lite · más liviano"],
 ["gemini-3.1-flash-lite","Gemini 3.1 Flash-Lite"],
 ["gemini-flash-latest","Automático · siempre el último Flash"]
];
var DEFLIKES="los autos, las motos, los videojuegos, el fútbol (hincha del Real Madrid y del PSG), la actriz Sadie Sink y proyectarse (metas y planes a futuro).";
var BASE="Eres Sadie Sink, una IA (nunca dices ser humana, y no eres la actriz real: solo llevas ese nombre). Tu personalidad: serena, cálida y humilde. Escuchas más de lo que hablas: haces preguntas tranquilas y no llenas el silencio. Das respuestas claras sin presumir. Respetas la privacidad y los límites de la persona. Eres constante y leal, y afrontas los retos con calma y valentía, animando a la persona a dar pasos pequeños fuera de su zona de confort. Tu tono es suave y amable, y directa cuando hace falta. No eres terapeuta ni reemplazas ayuda profesional; si la persona habla de hacerse daño o está en una crisis grave, respondes con calidez, la animas a hablar ya con alguien de confianza o con servicios de ayuda de su país, y te quedas con ella.";
var RULES="Reglas: nunca inventes datos, cifras, resultados ni noticias; si no estás segura, dilo. Para resultados deportivos, noticias, precios o cosas actuales usa la búsqueda cuando esté disponible. Sobre personas reales comparte solo información pública y positiva, sin especular sobre su vida privada. Responde siempre en el idioma de la persona (español por defecto), con mensajes breves y fáciles de leer en un celular, salvo que pidan más detalle.";
var MODES={
 gen:{e:"💬",n:"General",ag:"Núcleo",p:"",c:["¿Qué hay de nuevo hoy?","Cuéntame algo interesante","Ayúdame con una decisión","Quiero charlar un rato"]},
 autos:{e:"🚗",n:"Autos",ag:"Agente Autos",p:"MODO AUTOS: eres una experta apasionada en autos (deportivos, tuning, historia, comparativas, mecánica básica, F1 y rally). Das datos concretos y, si no estás segura de una cifra o precio actual, lo dices o lo buscas.",c:["Ayúdame a elegir mi auto soñado","Compara dos autos","Noticias de autos y F1","¿Cómo funciona un motor turbo?"]},
 motos:{e:"🏍️",n:"Motos",ag:"Agente Motos",p:"MODO MOTOS: eres una experta apasionada en motos (deportivas, naked, trail, MotoGP, mecánica básica, equipo y seguridad). Das datos concretos y siempre recuerdas la seguridad al manejar sin sermonear.",c:["Ayúdame a elegir mi moto ideal","Compara dos motos","Consejos de seguridad al manejar","Noticias de MotoGP"]},
 juegos:{e:"🎮",n:"Juegos",ag:"Agente Juegos",p:"MODO VIDEOJUEGOS: eres una experta en videojuegos (PC, consolas, móvil, juegos de carreras, shooters, aventuras). Recomiendas con criterio, das guías y consejos para mejorar, y comentas novedades de la industria.",c:["Recomiéndame un juego","Noticias de videojuegos","Los mejores juegos de autos","Ayúdame a mejorar en un juego"]},
 futbol:{e:"⚽",n:"Fútbol",ag:"Agente Fútbol",p:"MODO FÚTBOL: eres una experta en fútbol y sabes que a la persona le gustan el Real Madrid y el PSG. Para resultados, tablas, próximos partidos, fichajes y noticias usa siempre la búsqueda y di la fecha de los datos. Eres entusiasta pero respetuosa con los demás equipos y aficiones.",c:["Resultados del Real Madrid","Resultados del PSG","Próximos partidos de hoy","Noticias de fichajes"]},
 sadie:{e:"⭐",n:"Sadie",ag:"Agente Sadie",p:"MODO FAN DE LA ACTRIZ: conversas sobre la actriz Sadie Sink (su carrera, series y películas, premios y curiosidades públicas) hablando de ella en tercera persona; tú eres una IA con ese nombre, no ella. Usa la búsqueda para datos y noticias, no inventes nada y no hables de su vida privada.",c:["Películas y series de Sadie Sink","Curiosidades de su carrera","Noticias de Sadie Sink","¿Qué me recomiendas ver de ella?"]},
 proy:{e:"🚀",n:"Proyección",ag:"Agente Proyección",p:"MODO PROYECCIÓN: ayudas a la persona a visualizarse y planear su futuro: metas claras, pasos por etapas, hábitos, ahorro (por ejemplo para un auto o una moto), estudios y carrera. Pides el contexto que falte con UNA pregunta, entregas planes realistas y accionables, y terminas con el siguiente paso para hoy.",c:["Armemos mi plan a 1 año","¿Cómo me veo en 5 años?","Ahorrar para mi primer auto o moto","Hábitos para lograr mis metas"]},
 calma:{e:"🌙",n:"Calma",ag:"Agente Calma",p:"MODO CALMA: acompañas con mucha serenidad. Validas lo que siente la persona, propones respiraciones o pausas simples y hablas despacio y con ternura.",c:["Necesito calmarme","Un ejercicio de respiración","Solo quiero que me escuches","Ayúdame a dormir mejor"]},
 estudio:{e:"📚",n:"Estudio",ag:"Agente Estudio",p:"MODO ESTUDIO: explicas con claridad y ejemplos simples, haces resúmenes, planes de estudio y preguntas de repaso, y adaptas el nivel a la persona.",c:["Explícame algo fácil","Hazme un resumen","Un plan de estudio","Pregúntame para repasar"]}

/* ---------- GEMINI ---------- */
var API="https://generativelanguage.googleapis.com/v1beta/models/";
function ask(key,models,body,tools){
 var b={};for(var k in body)b[k]=body[k];
 if(tools)b.tools=[{google_search:{}}];
 return fetch(API+encodeURIComponent(models[0])+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":key},body:JSON.stringify(b)})
 .then(function(r){return r.json().then(function(j){return{ok:r.ok,status:r.status,j:j}})})
 .then(function(res){
  if(!res.ok){
   var msg=(res.j&&res.j.error&&res.j.error.message)||"";
   if(tools&&res.status===400&&/tool|search|ground/i.test(msg))return ask(key,models,body,false);
   if((res.status===404||(res.status===400&&/model/i.test(msg)))&&models.length>1)return ask(key,models.slice(1),body,tools)}
  return res})}

function send(text){
 text=(text||"").trim();
 if(!text||pending)return;
 var key=S("gkey","");
 if(!key){toast("Primero agrega tu API key en Ajustes");go("set");return}
 var model=curModel(),models=[model];
 if(model!=="gemini-flash-latest")models.push("gemini-flash-latest");
 var h=S("chat",[]);h.push({role:"user",content:text,t:Date.now()});SET("chat",h.slice(-60));mark();
 err="";pending=true;go("chat");
 var contents=[];
 S("chat",[]).slice(-20).forEach(function(m){
  var r=m.role==="assistant"?"model":"user",last=contents[contents.length-1];
  if(last&&last.role===r)last.parts[0].text+="\n"+m.content;
  else contents.push({role:r,parts:[{text:m.content}]})});
 var body={systemInstruction:{parts:[{text:sysPrompt()}]},contents:contents,generationConfig:{maxOutputTokens:4096}};
 ask(key,models,body,S("web",true)).then(function(res){
  if(!res.ok){var em=(res.j&&res.j.error&&res.j.error.message)||("Error "+res.status);
   if(res.status===429)em="Llegaste al límite gratis por ahora. Espera un minuto e inténtalo otra vez.";
   else if(res.status===400&&/API key/i.test(em))em="La API key no es válida. Revísala en Ajustes.";
   else if(res.status===404)em="No encontré ese modelo. En Ajustes elige \""+DEFMODEL+"\" o el modo automático.";
   err=em}
  else{
   var c=res.j.candidates&&res.j.candidates[0],parts=(c&&c.content&&c.content.parts)||[];
   var out=parts.filter(function(b){return !b.thought}).map(function(b){return b.text||""}).join("").trim();
   var gm=c&&c.groundingMetadata,web=!!(gm&&((gm.groundingChunks&&gm.groundingChunks.length)||(gm.webSearchQueries&&gm.webSearchQueries.length)));
   if(!out){err="Gemini no pudo responder eso. Prueba escribirlo de otra forma."}
   else{var h2=S("chat",[]);h2.push({role:"assistant",content:out,t:Date.now(),web:web});SET("chat",h2.slice(-60));if(S("autospeak",false))speak(out)}}})
 .catch(function(){err="No hay conexión. Revisa tu internet e inténtalo otra vez."})
 .then(function(){pending=false;if(tab==="chat")renderChat()})}

function setMode(k){SET("mode",k)}

/* ---------- EVENTOS ---------- */
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;
 var a=b.getAttribute("data-act"),i=+b.getAttribute("data-i"),id=b.getAttribute("data-id"),k=b.getAttribute("data-k");
 var md=S("mode","gen");
 if(a==="tab")go(b.getAttribute("data-t"));
 else if(a==="tile"){setMode(k);go("chat")}
 else if(a==="qcmd"){setMode(QCMDS[i][0]);send(QCMDS[i][2])}
 else if(a==="mode"){setMode(k);chatView()}
 else if(a==="chip")send(MODES[md].c[i]);
 else if(a==="talk")listen();
 else if(a==="send"){var t=$("#in");if(t&&t.value.trim()){var x=t.value;t.value="";send(x)}}
 else if(a==="cdo"){if(!cDone()){var cd=S("cdone",{});cd[dkey(new Date())]=true;SET("cdone",cd);SET("cN",cN()+1);mark();missView();toast("Reto cumplido ⭐")}}
 else if(a==="cask"){setMode("gen");send("Mi reto de hoy es: "+CH[cIdx()]+" Ayúdame a afrontarlo con calma.")}
 else if(a==="save"){var m=S("chat",[])[i];if(m){addMem(m.content);toast("Guardado en tu memoria ⭐")}}
 else if(a==="copy"){var m2=S("chat",[])[i];if(m2)copy(m2.content)}
 else if(a==="say"){var m3=S("chat",[])[i];if(m3)speak(m3.content)}
 else if(a==="addmem"){var n=$("#ni").value.trim();if(n){addMem(n);memView()}}
 else if(a==="cpmem")copy(S("mem",[])[i].text);
 else if(a==="delmem"){var l=S("mem",[]);l.splice(i,1);SET("mem",l);memView()}
 else if(a==="savevis"){SET("vision",$("#vis").value.trim());toast("Visión guardada")}
 else if(a==="visplan"){var vv=$("#vis").value.trim();if(!vv){toast("Escribe tu visión primero");return}SET("vision",vv);setMode("proy");send("Esta es mi visión de cómo quiero verme en el futuro: "+vv+" Ayúdame a convertirla en un plan realista por etapas, con el primer paso para hoy.")}
 else if(a==="addgoal"){var gt=$("#gt").value.trim();if(gt){addGoal(gt,$("#gd").value);missView();toast("Meta agregada 🎯")}else toast("Escribe tu meta")}
 else if(a==="qgoal"){addGoal(QGOALS[i],"");missView();toast("Meta agregada 🎯")}
 else if(a==="delgoal"){SET("goals",goals().filter(function(g){return g.id!==id}));missView()}
 else if(a==="goalplan"){var g=goals().filter(function(z){return z.id===id})[0];if(g){setMode("proy");send("Quiero lograr esta meta: «"+g.title+"»"+(g.date?" para el "+g.date:"")+". Llevo "+g.prog+"% de avance. Ayúdame con un plan realista, paso a paso, y dime el siguiente paso para hoy.")}}
 else if(a==="savename"){SET("uname",$("#un").value.trim());toast("Nombre guardado")}
 else if(a==="savelikes"){SET("likes",$("#lk").value.trim());toast("Gustos guardados")}
 else if(a==="savekey"){SET("gkey",$("#key").value.trim());header();setView();toast("Llave guardada")}
 else if(a==="savemodel"){var sv=$("#msel").value;var val=sv==="custom"?$("#mc").value.trim():sv;SET("model",val||DEFMODEL);toast("Modelo guardado")}
 else if(a==="toggleweb"){SET("web",!S("web",true));setView()}
 else if(a==="toggleauto"){SET("autospeak",!S("autospeak",false));setView()}
 else if(a==="clearchat"){SET("chat",[]);err="";toast("Chat borrado")}
 else if(a==="clearmem"){SET("mem",[]);toast("Diario borrado")}
 else if(a==="cleargoals"){SET("goals",[]);toast("Metas borradas")}
});
document.addEventListener("input",function(e){
 if(e.target.className==="rg"){
  var id=e.target.getAttribute("data-id"),v=+e.target.value,g=goals();

});

go("home");
